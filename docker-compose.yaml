version: "3.9"

services:
  freellmapi:
    image: node:20
    container_name: freellmapi
    working_dir: /app
    volumes:
      - ./app:/app
    command: sh -c "npm install && npm run build && node server/dist/index.js"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENCRYPTION_KEY=your_super_secret_32_char_key_here
      - API_KEY=your_api_key_here
    expose:
      - "3001"
    restart: unless-stopped
