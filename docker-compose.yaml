version: "3.9"

services:
  freellmapi:
    image: node:20
    container_name: freellmapi
    working_dir: /app
    volumes:
      - ./app:/app
    command: sh -c "npm install && npm run build && node server/dist/index.js"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENCRYPTION_KEY=super_secret_32_char_key_here
    expose:
      - "3001"
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: freellmapi_proxy
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - freellmapi
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
