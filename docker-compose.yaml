version: "3.9"

services:
  freellmapi:
    build: .
    container_name: freellmapi
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENCRYPTION_KEY=a1cc3501b79487748e1fdbfca0e6ced8dbaaf3d186553ea91448bc4023e8a285
      - API_KEY=your_api_key_here
    expose:
      - "3001"
    
    labels:
      - "traefik.enable=true"

      # Basic Auth definition (Ensure "Escape special characters" is OFF in Coolify if using $$ here)
      - "traefik.http.middlewares.freellmapi-auth.basicauth.users=admin:$2y$10$n0J0.69y7Bt3zEtoqrEcbeX0JEdzr56EsElVoed3u6U340oOHvbRC"

      # Tells Coolify to merge this middleware into your auto-generated HTTPS routers
      - "coolify.traefik.middlewares=freellmapi-auth"

      # Service port
      - "traefik.http.services.freellmapi.loadbalancer.server.port=3001"

    restart: unless-stopped
