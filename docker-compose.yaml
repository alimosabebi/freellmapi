
services:
  freellmapi:
    image: node:20
    working_dir: /app
    volumes:
      - ./app:/app
    command: sh -c "npm install && npm run build && node server/dist/index.js"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENCRYPTION_KEY=super_secret_32_char_key_here
    expose:
      - "3001"
    restart: unless-stopped

  caddy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - freellmapi
    restart: unless-stopped
